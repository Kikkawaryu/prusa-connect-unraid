- name: Download default config.yaml
        if: steps.check.outputs.skip != 'true'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          curl -fsSL "https://github.com/prusa3d/prusa-connect/releases/download/${TAG}/config.yaml" -o default-config.yaml \
            || curl -fsSL "https://github.com/prusa3d/prusa-connect/releases/latest/download/config.yaml" -o default-config.yaml

name: Build and Push Prusa Connect

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific upstream tag to build (leave blank for latest release)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/build.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target Prusa Connect tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh api repos/prusa3d/prusa-connect/releases --jq '.[0].tag_name // empty' 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              TAG=$(gh api repos/prusa3d/prusa-connect/tags --jq '.[0].name // empty' 2>/dev/null || true)
            fi
            if [ -z "$TAG" ]; then
              TAG="main"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved target ref: ${TAG}"

      - name: Check if tag is already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$TAG" != "main" ]; then
            EXISTS=$(gh api /users/kikkawaryu/packages/container/prusa-connect/versions --jq ".[].metadata.container.tags[]" 2>/dev/null | grep -Fx "$TAG" || true)
            if [ -n "$EXISTS" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already built; skipping scheduled build."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build official Prusa Connect base image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/prusa3d/prusa-connect.git#${{ steps.release.outputs.tag }}
          file: docker/server/Dockerfile
          push: true
          tags: localhost:5000/prusa-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Unraid wrapper image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-contexts: |
            prusa-base=docker-image://localhost:5000/prusa-base:latest
          push: true
          tags: |
            ghcr.io/kikkawaryu/prusa-connect:latest
            ghcr.io/kikkawaryu/prusa-connect:${{ steps.release.outputs.tag }}
