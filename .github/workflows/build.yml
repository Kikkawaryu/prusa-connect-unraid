name: Build and Push Prusa Connect

on:
  schedule:
    # Checks for new upstream releases every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific upstream tag to build (leave blank for latest release)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target Prusa Connect tag
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -n "${{ github.event.inputs.tag }}" ]; then
          TAG="${{ github.event.inputs.tag }}"
        else
          TAG=$(gh api repos/prusa3d/prusa-connect/releases --jq '.[0].tag_name // empty' 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/prusa3d/prusa-connect/tags --jq '.[0].name // empty' 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then
            TAG="main"
          fi
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "Resolved target ref: ${TAG}"

      - name: Check if tag is already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$TAG" != "main" ]; then
            EXISTS=$(gh api /users/kikkawaryu/packages/container/prusa-connect/versions --jq ".[].metadata.container.tags[]" 2>/dev/null | grep -Fx "$TAG" || true)
            if [ -n "$EXISTS" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already built; skipping scheduled build."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PRUSA_TAG=${{ steps.release.outputs.tag }}
          tags: |
            ghcr.io/kikkawaryu/prusa-connect:latest
            ghcr.io/kikkawaryu/prusa-connect:${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
