- name: Build and push Docker image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/prusa3d/prusa-connect.git#${{ steps.release.outputs.tag }}
          file: docker/server/Dockerfile
          push: true
          tags: |
            ghcr.io/kikkawaryu/prusa-connect:latest
            ghcr.io/kikkawaryu/prusa-connect:${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
